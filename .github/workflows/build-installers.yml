name: Build Cafe Flow installers

# Triggered for an Android APK test build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "capacitor.config.json"
      - "www/**"
      - "src/**"
      - "package.json"
      - ".github/workflows/build-installers.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows desktop installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save electron@41.0.0 electron-builder@26.0.12
      - run: npx electron-builder --win portable --x64
      - uses: actions/upload-artifact@v4
        with:
          name: cafe-flow-windows
          path: release/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
      # Capacitor requires the configured webDir to exist, even though the app loads the hosted Cafe Flow URL.
      - run: mkdir -p www && printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body></body></html>' > www/index.html
      - run: npx cap add android
      - run: npx cap sync android
      - name: Add Android Bluetooth permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = "<application"
          permissions = """    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />"""
          if "android.permission.BLUETOOTH_SCAN" not in s:
              s = s.replace(marker, permissions + "\n    " + marker, 1)
          p.write_text(s)
          PY
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cafe-flow-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
