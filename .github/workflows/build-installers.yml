name: Build Cafe Flow installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "capacitor.config.json"
      - "www/**"
      - "package.json"
      - ".github/workflows/build-installers.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows desktop installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win portable --x64
      - uses: actions/upload-artifact@v5
        with:
          name: cafe-flow-windows
          path: release/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cafe-flow-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
