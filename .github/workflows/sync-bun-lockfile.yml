name: Sync Bun lockfile

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - ".github/workflows/sync-bun-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Regenerate lockfile
        run: bun install --lockfile-only
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- bun.lock bun.lockb; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock bun.lockb
          git commit -m "chore: synchronize Bun lockfile"
          git push origin main
