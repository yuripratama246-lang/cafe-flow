name: Phase 3 Public Website API Validation

on:
  push:
    branches:
      - phase-3-public-website-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: phase-3-public-website-api
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production bundle
        run: npm run build
      - name: Verify seven API route files and GET handlers
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            "src/routes/api.website.v1.pages.home.ts"
            "src/routes/api.website.v1.pages.about.ts"
            "src/routes/api.website.v1.careers.ts"
            "src/routes/api.website.v1.gallery.ts"
            "src/routes/api.website.v1.locations.ts"
            "src/routes/api.website.v1.contact.ts"
            "src/routes/api.website.v1.settings.ts"
          )
          for route in "${routes[@]}"; do
            test -f "$route"
            grep -q 'GET' "$route"
            echo "PASS route: $route"
          done
      - name: Scan built browser bundle for secrets and server-only material
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir=".output/public"
          test -d "$bundle_dir" || { echo "FAIL: $bundle_dir missing"; exit 1; }
          mapfile -t bundle_files < <(find "$bundle_dir" -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.map' \) -print)
          if [ "${#bundle_files[@]}" -eq 0 ]; then
            echo "FAIL: no JS/MJS/source-map files found to scan in $bundle_dir"
            exit 1
          fi
          echo "Scanning ${#bundle_files[@]} built browser files under $bundle_dir"
          if grep -n -E 'SUPABASE_SERVICE_ROLE_KEY|service_role|website-public-api\.server|client\.server|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' "${bundle_files[@]}"; then
            echo "FAIL: secret/server-only marker found in built browser bundle"
            exit 1
          fi
          echo "PASS: scanned ${#bundle_files[@]} built browser files; no configured secret/server-only markers found"
      - name: Runtime GET smoke tests for public website API
        shell: bash
        env:
          API_BASE_URL: https://cafeflow.alpana1project.workers.dev
        run: |
          set -euo pipefail
          endpoints=(
            "/api/website/v1/pages/home"
            "/api/website/v1/pages/about"
            "/api/website/v1/careers"
            "/api/website/v1/gallery"
            "/api/website/v1/locations"
            "/api/website/v1/contact"
            "/api/website/v1/settings"
          )
          for endpoint in "${endpoints[@]}"; do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error --location --max-time 20 -o "$response_file" -w '%{http_code}' "$API_BASE_URL$endpoint")"
            echo "GET $endpoint -> HTTP $status"
            if [[ "$status" != "200" && "$status" != "404" ]]; then
              cat "$response_file"
              rm -f "$response_file"
              echo "FAIL: unexpected HTTP status for $endpoint"
              exit 1
            fi
            if ! node -e 'const fs=require("fs"); JSON.parse(fs.readFileSync(process.argv[1],"utf8"))' "$response_file"; then
              cat "$response_file"
              rm -f "$response_file"
              echo "FAIL: response is not valid JSON for $endpoint"
              exit 1
            fi
            rm -f "$response_file"
          done
          echo "PASS: all seven GET endpoints returned JSON with HTTP 200 or 404"
